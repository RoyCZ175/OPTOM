<section class="container py-5">
    <div class="text-center mb-5" data-aos="fade-down">
        <h2 class="fw-bold text-primary">Estamos Listos para Ayudarte</h2>
        <p class="lead">Atención de Emergencias y Soporte Técnico 24/7/365</p>
    </div>

    <div class="row g-5">
        <div class="col-md-7" data-aos="fade-right">
            <div class="bg-white p-5 shadow rounded border-top border-warning border-4">
                <form>
                    <div class="mb-3"><label class="form-label fw-bold">Nombre Completo</label><input type="text" class="form-control" placeholder="Juan Pérez"></div>
                    <div class="mb-3"><label class="form-label fw-bold">Correo</label><input type="email" class="form-control" placeholder="nombre@empresa.com"></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Interés</label>
                        <select class="form-select">
                            <option>Cotización Data Center</option>
                            <option>Energía Solar</option>
                            <option>Mantenimiento Preventivo</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label fw-bold">Mensaje</label><textarea class="form-control" rows="4"></textarea></div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold p-3">ENVIAR SOLICITUD</button>
                </form>
            </div>
        </div>

        <div class="col-md-5" data-aos="fade-left">
            <div class="p-4 bg-dark text-white rounded shadow h-100">
                <h4 class="mb-4 text-warning">Información Directa</h4>
                <div class="mb-4"><i class="fas fa-envelope me-2 text-warning"></i> francisco.caiza@optom.com.ec</div>
                <div class="mb-4"><i class="fas fa-phone me-2 text-warning"></i> +593 99 695 6854</div>
                <div class="mt-5 p-3 border border-warning rounded">
                    <p class="mb-0"><i class="fas fa-clock me-2"></i> Soporte de Misión Crítica activo en todo Ecuador.</p>
                </div>
            </div>
        </div>
